# Secret scanning for this repository.
#
# The one recurring false positive is the WebSocket handshake nonce. RFC 6455
# section 1.3 gives "dGhlIHNhbXBsZSBub25jZQ==" as its worked example, which is
# base64 for "the sample nonce"; it is a protocol constant, not a credential.
# A generic high-entropy rule cannot tell the difference, so it is allowlisted
# by value rather than by file, and any other finding in the same file still
# reports.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''

[rules.allowlist]
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
